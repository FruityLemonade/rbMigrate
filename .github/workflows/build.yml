name: Build

on:
  push:
    branches: [main, dev]
  workflow_dispatch:

jobs:
  build-macos:
    name: Build macOS app
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Build app and dmg
        run: |
          chmod +x build_macos.sh
          ./build_macos.sh

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: rbMigrate-macos
          path: |
            dist/rbMigrate-arm.app
            dist/rbMigrate-arm-*.dmg
            dist/rbMigrate-intel.app
            dist/rbMigrate-intel-*.dmg
            dist/rbMigrate-universal.app
            dist/rbMigrate-universal-*.dmg

  build-windows:
    name: Build Windows exe
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Build exe
        run: .\build_windows.bat

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: rbMigrate-windows
          path: dist/rbMigrate/rbMigrate.exe
